/* =========================
   GLOBAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family:
        "Poppins",
        "Noto Sans Devanagari",
        sans-serif;

    background: #fff9ec;

    color: #222;
}


/* =========================
   GALLERY SECTION
========================= */

.gallery-section {
    min-height: 100vh;

    padding: 35px 20px 60px;

    background:
        radial-gradient(
            circle at top center,
            rgba(255, 214, 112, 0.16),
            transparent 45%
        ),
        #fff9ec;
}


/* =========================
   TITLE
========================= */

.gallery-title {
    text-align: center;

    font-family:
        "Playfair Display",
        serif;

    font-size: clamp(38px, 5vw, 50px);

    font-weight: 700;

    margin-bottom: 8px;

    color: #242424;
}

.gallery-title span {
    color: #a5003b;
}


/* =========================
   SUBTITLE
========================= */

.gallery-subtitle {
    text-align: center;

    color: #a9a294;

    font-size: 14px;

    margin-bottom: 38px;
}


/* =========================
   GALLERY GRID
========================= */

.gallery-grid {
    max-width: 1200px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;
}


/* =========================
   GALLERY ITEM
========================= */

.gallery-item {
    height: 235px;

    overflow: hidden;

    border-radius: 15px;

    background: white;

    box-shadow:
        0 7px 18px
        rgba(70, 48, 20, 0.10);

    transition: 0.35s;
}


/* =========================
   IMAGE
========================= */

.gallery-item img {
    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition: 0.5s;
}


/* =========================
   HOVER
========================= */

.gallery-item:hover {
    transform: translateY(-5px);

    box-shadow:
        0 12px 25px
        rgba(70, 48, 20, 0.16);
}

.gallery-item:hover img {
    transform: scale(1.07);
}


/* =========================
   TABLET
========================= */

@media (max-width: 992px) {

    .gallery-grid {

        grid-template-columns:
            repeat(2, 1fr);

        max-width: 800px;
    }

    .gallery-item {
        height: 230px;
    }
}


/* =========================
   MOBILE
========================= */

@media (max-width: 576px) {

    .gallery-section {
        padding:
            25px 12px 45px;
    }

    .gallery-title {
        font-size: 34px;
    }

    .gallery-subtitle {
        font-size: 12px;

        margin-bottom: 25px;
    }

    .gallery-grid {

        grid-template-columns: 1fr;

        gap: 18px;

        max-width: 450px;
    }

    .gallery-item {
        height: 220px;

        border-radius: 12px;
    }
}


/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 400px) {

    .gallery-title {
        font-size: 30px;
    }

    .gallery-item {
        height: 200px;
    }
}
